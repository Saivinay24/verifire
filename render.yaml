# Render Blueprint: one web service + one Postgres database, both in Singapore.
# Region matters: lookups must answer in < 0.5 s from India; Oregon alone costs ~300 ms per round trip.
services:
  - type: web
    name: scammap
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: scammap-db
          property: connectionString
      - key: REPORTER_HMAC_SECRET
        generateValue: true

databases:
  - name: scammap-db
    region: singapore
    plan: free
    databaseName: scammap
